<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
  <!-- Vector Surrealism: an arched doorway to nowhere, standing alone on the horizon (original artwork) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0A2B"/>
      <stop offset="0.6" stop-color="#1B1340"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
  </defs>
  <!-- its long shadow, thrown far across the ground -->
  <path fill="#0F0A2B" opacity="0.55" d="M150 262 L290 262 L276 276 L150 276Z"/>
  <!-- three steps up to it -->
  <path fill="#2A1F5C" d="M36 262h128v14H36Z M48 250h104v12H48Z"/>
  <!-- frame -->
  <path fill="#B8A1FF" d="M56 250V104a44 44 0 0 1 88 0v146Z"/>
  <!-- the opening: another sky, with its own little moon -->
  <path fill="url(#sky)" d="M70 250V108a30 30 0 0 1 60 0v142Z"/>
  <circle cx="112" cy="122" r="9" fill="#FFF1DC"/>
  <circle cx="116" cy="119" r="8" fill="#0F0A2B"/>
  <!-- keystone -->
  <path fill="#FFC93C" d="M92 52h16l-3 12h-10Z"/>
</svg>
