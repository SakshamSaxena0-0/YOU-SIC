    <path d="M70 200a50 50 0 0 1 20-96a66 66 0 0 1 120-38a58 58 0 0 1 104 34a48 48 0 0 1 16 100Z"/>
  </g>
  <path fill="#D9CCFF" d="M70 200a50 50 0 0 1 20-96a66 66 0 0 1 120-38a58 58 0 0 1 104 34a48 48 0 0 1 16 100Z"/>
