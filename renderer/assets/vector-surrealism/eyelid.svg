<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 64" preserveAspectRatio="none">
  <!-- Vector Surrealism: the cloud's eyelid (original artwork). It covers the almond of eye-cloud.svg;
       CSS scales it from 0 to 1 on Y, from the top, to make the eye blink. -->
