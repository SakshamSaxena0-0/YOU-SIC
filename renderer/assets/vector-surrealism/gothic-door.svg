<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280">
<!-- Vector Surrealism (dark fantasy): a pointed gothic doorway to nowhere, standing alone on the horizon, with a
       will-o'-wisp waiting inside (original artwork) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0610"/>
      <stop offset="0.62" stop-color="#5A1E33"/>
      <stop offset="1" stop-color="#B8394F"/>
    </linearGradient>
  </defs>
  <!-- its long shadow, thrown far across the ground -->
  <path fill="#040208" opacity="0.55" d="M150 262L290 262L276 276L150 276Z"/>
  <!-- three steps up to it -->
  <path fill="#241933" d="M36 262h128v14H36Z M48 250h104v12H48Z"/>
  <!-- the frame: an equilateral pointed arch -->
  <path fill="#7D6F9C" d="M56 250V120A88 88 0 0 1 100 43.8A88 88 0 0 1 144 120V250Z"/>
  <path fill="#A79BC2" d="M56 250V120A88 88 0 0 1 100 43.8L100 52A80 80 0 0 0 63 120V250Z"/>
  <!-- the opening: another sky, with its own little crescent -->
  <path fill="url(#sky)" d="M70 250V124A60 60 0 0 1 100 72A60 60 0 0 1 130 124V250Z"/>
  <circle cx="112" cy="104" r="9" fill="#EEE2CB"/>
  <circle cx="116" cy="101" r="8" fill="#0A0610"/>
  <!-- the wisp -->
  <circle cx="100" cy="206" r="22" fill="#5ED6A8" opacity="0.14"/>
  <path fill="#5ED6A8" d="M100 180c7 9 11 16 11 22a11 11 0 0 1-22 0c0-6 4-13 11-22Z"/>
  <path fill="#B5F2D8" d="M100 194c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10Z"/>
  <!-- keystone -->
  <path fill="#E8BF5F" d="M100 28l8 11-8 11-8-11Z"/>
</svg>
