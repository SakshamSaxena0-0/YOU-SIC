<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380">
  <!-- Vector Surrealism: a hand rising out of the ground, holding up a crescent moon (original artwork) -->
  <defs>
    <mask id="crescent">
      <rect width="300" height="380" fill="#fff"/>
      <circle cx="174" cy="64" r="50" fill="#000"/>
    </mask>
    <g id="hand">
      <!-- sleeve and cuff -->
      <path d="M100 300h100v80H100Z"/>
      <!-- palm -->
      <path d="M92 300V226a22 22 0 0 1 22-22h72a22 22 0 0 1 22 22v74Z"/>
      <!-- fingers -->
      <rect x="92" y="150" width="26" height="86" rx="13"/>
      <rect x="120" y="132" width="26" height="100" rx="13"/>
      <rect x="148" y="136" width="26" height="96" rx="13"/>
      <rect x="176" y="156" width="26" height="78" rx="13"/>
      <!-- thumb -->
      <rect x="196" y="214" width="26" height="72" rx="13" transform="rotate(-38 209 250)"/>
    </g>
  </defs>
  <!-- long shadow -->
  <use href="#hand" fill="#0F0A2B" opacity="0.5" transform="translate(12 10)"/>
  <use href="#hand" fill="#B8A1FF"/>
  <!-- sleeve over the palm colour, and a cuff stripe -->
  <path fill="#FF5FA2" d="M100 312h100v68H100Z"/>
  <path fill="#FFF1DC" d="M100 312h100v12H100Z"/>
  <!-- finger creases as flat slivers -->
  <g fill="#9C85EE">
    <rect x="98" y="200" width="14" height="4" rx="2"/>
    <rect x="126" y="186" width="14" height="4" rx="2"/>
    <rect x="154" y="188" width="14" height="4" rx="2"/>
    <rect x="182" y="204" width="14" height="4" rx="2"/>
  </g>
  <!-- the crescent moon, balanced on the fingertips -->
  <circle cx="150" cy="80" r="58" fill="#0F0A2B" opacity="0.5" transform="translate(10 8)" mask="url(#crescent)"/>
  <circle cx="150" cy="80" r="58" fill="#FFC93C" mask="url(#crescent)"/>
</svg>
