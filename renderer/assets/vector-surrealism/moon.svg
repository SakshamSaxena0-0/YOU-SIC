<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <!-- Vector Surrealism: a giant cream moon that is slowly melting (original artwork) -->
  <circle cx="200" cy="200" r="196" fill="#FF8A5B" opacity="0.16"/>
  <!-- hard offset long shadow -->
  <g transform="translate(14 14)" fill="#0F0A2B" opacity="0.45">
    <circle cx="200" cy="200" r="168"/>
  </g>
  <!-- the moon and its drips -->
  <path fill="#FFF1DC" d="M200 32a168 168 0 1 1-0.1 0Z
    M262 340h26v52a13 13 0 0 1-26 0Z
    M300 312h18v34a9 9 0 0 1-18 0Z
    M150 356h20v62a10 10 0 0 1-20 0Z"/>
  <!-- craters: flat lavender-tinted discs -->
  <g fill="#E3D6FF">
    <circle cx="140" cy="140" r="34"/>
    <circle cx="258" cy="118" r="20"/>
    <circle cx="236" cy="236" r="44"/>
    <circle cx="120" cy="262" r="16"/>
    <circle cx="302" cy="214" r="12"/>
  </g>
  <g fill="#FFF1DC">
    <circle cx="146" cy="134" r="22"/>
    <circle cx="244" cy="228" r="30"/>
  </g>
</svg>
